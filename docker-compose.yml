name: securepr-agent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securepr
      POSTGRES_USER: securepr
      POSTGRES_PASSWORD: ${SECUREPR_POSTGRES_PASSWORD:?set SECUREPR_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securepr"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  securepr:
    build: .
    ports:
      - "8080:8080"
    environment:
      SECUREPR_HOST: 0.0.0.0
      SECUREPR_DATABASE_URL: postgresql://securepr:${SECUREPR_POSTGRES_PASSWORD:?set SECUREPR_POSTGRES_PASSWORD}@postgres:5432/securepr
      SECUREPR_REDIS_URL: redis://redis:6379/0
      SECUREPR_ASYNC_WORKERS: 4
      SECUREPR_SKILLS_DIR: /app/skills
      SECUREPR_AUTH_REQUIRED: "true"
      SECUREPR_AUTH_SECRET: ${SECUREPR_AUTH_SECRET:?set SECUREPR_AUTH_SECRET}
      SECUREPR_BOOTSTRAP_ADMIN_USERNAME: ${SECUREPR_BOOTSTRAP_ADMIN_USERNAME:-admin}
      SECUREPR_BOOTSTRAP_ADMIN_PASSWORD: ${SECUREPR_BOOTSTRAP_ADMIN_PASSWORD:?set SECUREPR_BOOTSTRAP_ADMIN_PASSWORD}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
